# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                         ArkaSMPCore configuration                        ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║  Change a value, then run  /arka reload  (no restart needed).            ║
# ║  Admins can also change numbers in-game:  /arka admin set <path> <value> ║
# ║  Text uses MiniMessage colours: <green> <red> <gold> <bold> <gray> ...   ║
# ║  Per-rank limits with permissions:  arka.homes.limit.<number>            ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# MANAGED BY THE PLUGIN - DO NOT CHANGE THIS LINE. It stores the plugin version that last updated this file.
# When you install a newer version, new options are added below automatically and your settings are kept
# (a backup of the old file goes to the config-backups folder).
config-version: "auto"


# ──────────────────────────────── TELEPORTING ────────────────────────────────
# Applies to /home, /spawn, /tpa and /rtp.
teleport:
  warmup: 3                 # seconds a player must stand still (0 = instant)
  cancel-on-move: true      # moving cancels the teleport
  cancel-on-damage: true    # taking damage cancels the teleport
  block-in-combat: true     # no teleporting for a few seconds after PvP (afk.combat-lock-seconds)


# ───────────────────────────────────── HOMES ─────────────────────────────────
homes:
  default-limit: 3              # homes every player gets (admins can override per player)
  # Home limit per rank. The name must match the LuckPerms group name exactly.
  # A player gets the HIGHEST limit among the groups they are in (and default-limit).
  # Add as many ranks as you like. Per-player override: /arka admin homelimit set <player> <n>
  ranks:
    member: 3
    vip: 6
    youtube: 10
    admin: 50
  cooldown: 5                   # seconds between /home uses
  block-in-foreign-claims: true # cannot set a home inside someone else's claim


# ───────────────────────────────────── SPAWN ─────────────────────────────────
spawn:
  teleport-on-first-join: true  # new players start at /setspawn
  teleport-on-respawn: true     # after death (only if they have no bed/anchor)


# ────────────────────────────────── TPA REQUESTS ─────────────────────────────
tpa:
  timeout: 60               # seconds before a request expires
  cooldown: 10              # seconds between sending requests


# ─────────────────────────────── RANDOM TELEPORT ─────────────────────────────
rtp:
  cooldown: 300             # seconds between uses
  min-radius: 500           # not closer than this to the centre
  max-radius: 5000          # not farther than this from the centre
  center-x: 0
  center-z: 0
  max-attempts: 15          # tries to find a safe spot before giving up
  avoid-claims: true        # never land inside a claim
  disabled-worlds: []       # e.g. [world_nether]; the End is always disabled


# ───────────────────────────────── SERVER STATS ─────────────────────────────
# /arka stats and %arka_stats_...% placeholders (weekly active players, new players, total joined...).
stats:
  weekly-active-minutes: 60   # a player counts as "weekly active" with MORE than this much play time in the last 7 days
  timezone: ""               # for the busiest/quietest hour, e.g. Asia/Kolkata (empty = the server's own time zone)

# ─────────────────────────────────── WARPS ──────────────────────────────────
# /warp <name>  = server warps made by admins (/setwarp <name>, /delwarp <name>)
# /pwarp <name> = warps made by players (/pwarp set <name>, /pwarp delete <name>)
# Every warp is checked when it is made AND right before every teleport. Unsafe = the teleport is refused.
warps:
  enabled: true
  cooldown: 5                 # seconds between /warp and /pwarp teleports
  warn-other-world: true      # tell the player when the warp is in another world (nether, end...)
  disabled-worlds: []         # worlds where player warps cannot be made
  safety:
    max-height-above-ground: 12   # how far below the floor we look for ground
    platform-drop: 4              # a platform with a drop longer than this must not be tiny...
    min-platform-blocks: 4        # ...at least this many solid blocks (of the 3x3 under you)
    room-cells: 120               # a sealed pocket smaller than this (obsidian cell, closed box) is unsafe
pwarps:
  enabled: true
  default-limit: 1            # player warps every player may own
  create-cost: 500            # rupees to make a NEW player warp (0 = free; moving one is free). Needs ArkaSMPEconomy.
  # Limit per rank: the name must match the LuckPerms group exactly. The HIGHEST limit wins.
  # (Also: permission arka.pwarps.limit.<number>. Staff with arka.warp.free never pay.)
  ranks:
    member: 1
    vip: 2
    mvp: 3

# ───────────────────────────────── LAND CLAIMS ───────────────────────────────
# Players mark two corners with a golden shovel. The claim costs one claim
# block per ground block (a 20x30 claim costs 600).
claims:
  starting-blocks: 300      # claim blocks everyone gets when they first join
  blocks-per-hour: 100      # extra claim blocks earned per hour of play time
  max-earned-blocks: 0      # cap on blocks earned from play time (0 = no cap)
  min-size: 5               # smallest allowed width and length
  tool: GOLDEN_SHOVEL       # item used to mark corners
  bypass-needs-toggle: true # staff with arka.claims.bypass (OPs, wildcard) are protected like everyone else
                            # until they run /arka admin bypass. Set false for the old always-on bypass.
  inspect-tool: STICK       # right-click any block with this to see who owns the land and its border (red if not yours)
  inspect-unclaimed-message: true   # also say "nobody owns this" when the stick is used on free land
  disabled-worlds: []       # worlds where claiming is not allowed
  confirm-delete: true      # /unclaim, /claim delete and /claim deleteall ask "are you sure?" first
  buy:                      # /claim buy [amount]: claim blocks for rupees (needs ArkaSMPEconomy)
    enabled: true
    price-per-block: 2.0    # rupees per claim block
    max-per-purchase: 5000
    max-total: 50000        # most blocks one player can ever buy (0 = no limit)
    menu-amounts: [100, 500, 1000, 5000]
  transfer:                 # /claim send <player> <amount>: give UNUSED claim blocks to someone
    enabled: true
    min-amount: 10
    daily-cap: 3000         # most blocks one player can send per day (0 = no limit)
    min-play-hours: 5       # active play time needed before sending (stops fresh alt accounts feeding a main)
    menu-amounts: [50, 100, 500, 1000]
  show-enter-message: true  # "Entering X's land" above the hotbar
  warn:                     # what a player sees when they try to build/break/use things in someone else's claim
    chat: true              # also send a chat message (the action bar alone is easy to miss on phones)
    chat-interval-seconds: 5   # at most one chat warning per this many seconds
    sound: true             # small "no" sound with the chat warning
  border:
    material: GLOWSTONE     # fake block shown at the claim edge (only the player sees it)
    seconds: 15             # how long the border stays visible
    spacing: 2              # one marker every N blocks (1 = solid line)
    foreign-materials:      # someone ELSE's claim is drawn in these, alternating (red = not yours)
      - NETHERRACK
      - REDSTONE_BLOCK
    max-distance: 64        # only draw border parts this close to the player
  protect:                  # what is protected inside claims
    explosions: true
    fire: true
    pistons: true
    animals: true
    hoppers: true             # hoppers/minecarts outside cannot pull from or push into claimed chests
    dispensers: true          # dispensers outside a claim cannot place lava/water inside it
    liquids: true             # water/lava from outside cannot flow into a claim
    mob-griefing: true        # endermen, withers, etc. cannot change blocks inside claims
    mobs: all                 # who may hurt/kill mobs in a claim: only owner + trusted.
                              #   all = every mob incl. hostile | non-hostile = animals, villagers, pets, golems | off
    defend-self: true         # a mob that is attacking you may always be fought back


# ─────────────────────────────────── /TRAPPED ────────────────────────────────
# For players stuck inside someone else's claim (walled in, trapped by a trap).
# It only teleports them to a safe spot outside; they still cannot build or break in the claim.
trapped:
  enabled: true
  cooldown: 60              # seconds before it can be used again (starts only after a successful escape)
  distance: 10              # blocks outside the claim edge to land at
  max-attempts: 12          # how many spots are tried before giving up


# ───────────────────────────────── LEADERBOARDS ──────────────────────────────
# Top kills / deaths / money / playtime, shown as PlaceholderAPI placeholders
# (use them in DecentHolograms, TAB, scoreboards). See the placeholder list in
# the setup guide. Rankings refresh live every few seconds.
leaderboards:
  enabled: true
  refresh-seconds: 10       # how often online players' stats and the rankings update
  save-minutes: 5           # how often stats are saved to disk
  seed-existing: true       # first start: import players who joined before this plugin
  hide-permission: arka.leaderboard.hide   # players with this never appear (give it to staff)
  show-zero: false          # list players who have 0 kills / 0 deaths / $0
  same-victim-cooldown-seconds: 300   # killing the same player again within this time is not counted (anti boosting)
  empty-name: "-"           # shown when a rank slot is empty
  empty-value: "-"
  unranked: "-"             # shown as your position if you are hidden / unknown
  money-format: "$%,.0f"    # Java format: "$%,.2f" for cents, "%,.0f coins" etc.
  playtime-format: "{h}h {m}m"
  playtime-days-format: "{d}d {h}h"


# ─────────────────────────────────────── AFK ─────────────────────────────────
# Strict AFK detection. Only real player input counts (key presses, chat, clicks,
# breaking/placing blocks...). Being moved by water, pistons or minecarts does NOT.
# While AFK a player: earns no play time (no hourly reward, no claim blocks, no
# leaderboard time), makes no mobs spawn near them, has a tiny loaded area, and
# cannot be hurt by other players.
afk:
  enabled: true
  timeout-seconds: 120          # no real activity for this long = AFK
  tag: "&7[AFK] "               # what %arka_afk% shows while AFK (use it in TAB)
  announce: false               # tell everyone when someone goes/returns AFK
  combat-lock-seconds: 15       # after PvP you cannot go AFK (stops escaping a fight)
  invulnerable: false           # true = AFK players take no damage at all (void excepted)
  simulation-distance: 2        # chunks around an AFK player that still tick (min 2)
  view-distance: 3              # chunks sent to an AFK player (min 2)
  kick-after-minutes: 0         # kick players AFK this long (0 = never)
  bypass-permission: arka.afk.bypass   # staff/builders who are never marked AFK
  bedrock-movement-fallback: true      # Bedrock (Geyser) players: also count real walking if key presses are not reported
  macro:
    enabled: true               # catches players who only tap keys / jump in a small area
    window-seconds: 300         # look at this much time at once
    radius: 6                   # "small area" size in blocks
    wake-distance: 8            # a macro-AFK player must walk this far (or do a real action) to return


# ───────────────────────────── LAG CLEANER (ClearLag) ────────────────────────
cleaner:
  enabled: true
  interval-seconds: 600     # how often ground items are cleared
  warnings: [60, 30, 10, 5] # chat warnings, seconds before clearing
  items:
    enabled: true
    whitelist:              # these items are never removed
      - DIAMOND
      - DIAMOND_BLOCK
      - NETHERITE_INGOT
      - NETHERITE_SCRAP
      - ELYTRA
      - TOTEM_OF_UNDYING
      - ENCHANTED_GOLDEN_APPLE
      - SHULKER_BOX
  xp-orbs: false            # also remove experience orbs
  arrows: true              # remove arrows stuck in blocks / on the ground
  mobs:
    enabled: false          # remove the mob types below (named/tamed/leashed are kept)
    types: [ZOMBIE, SKELETON, CREEPER, SPIDER, ENDERMAN, WITCH, SLIME, PHANTOM, DROWNED, HUSK, STRAY]


